<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Reels</title>
    
    <!-- Firebase SDKs (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media(min-width: 481px) {
            #app-container {
                height: 90vh;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            }
        }

        /* लॉगिन स्क्रीन */
        .auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-screen.hidden {
            display: none;
        }

        .auth-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .auth-box h2 {
            margin-bottom: 8px;
            color: #ff3b5c;
            font-size: 24px;
        }

        .auth-box p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .google-btn { background: #fff; color: #333; }
        .facebook-btn { background: #1877f2; color: #fff; }
        .phone-btn { background: #25d366; color: #fff; }

        .divider {
            margin: 15px 0;
            font-size: 13px;
            color: #666;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #444;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .input-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .input-group.active {
            display: flex;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 15px;
        }

        .auth-box button.submit-input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff3b5c;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-to-social {
            margin-top: 10px;
            font-size: 13px;
            color: #ff3b5c;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* हेडर */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .header h1 {
            font-size: 20px;
            font-weight: bold;
            color: #ff3b5c;
        }

        .user-info {
            font-size: 13px;
            color: #ddd;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* रील्स फीड */
        .reels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 65px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 5;
        }

        .action-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .action-text {
            font-size: 12px;
            margin-top: 2px;
            text-align: center;
        }

        .reel-details {
            position: absolute;
            left: 15px;
            bottom: 30px;
            right: 80px;
            z-index: 5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .reel-username {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .reel-caption {
            font-size: 14px;
            color: #eee;
        }

        /* नेविगेशन बार */
        .navbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        .nav-item {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }

        .upload-tab-btn {
            background: #ff3b5c;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 59, 92, 0.4);
        }

        /* अपलोड मॉडल */
        .upload-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: #1e1e1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 200;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
        }

        .upload-modal.active {
            transform: translateY(0);
        }

        .upload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }

        .upload-form input[type="file"],
        .upload-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .upload-form textarea {
            resize: none;
            height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ff3b5c;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- लॉगिन स्क्रीन -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <h2 id="authHeading">Desi Reels</h2>
                <p id="authSub">अपने असली अकाउंट से लॉगिन करें</p>

                <div id="socialButtonsContainer">
                    <button class="social-btn google-btn" onclick="promptLogin('Google')">
                        🌐 Google से लॉगिन करें
                    </button>
                    <button class="social-btn facebook-btn" onclick="promptLogin('Facebook')">
                        📘 Facebook से लॉगिन करें
                    </button>
                    <div class="divider">या</div>
                    <button class="social-btn phone-btn" onclick="promptLogin('Phone')">
                        📱 मोबाइल नंबर से लॉगिन करें
                    </button>
                </div>

                <div id="inputGroup" class="input-group">
                    <input type="text" id="userInputField" placeholder="जानकारी दर्ज करें">
                    <button class="submit-input" onclick="completeLogin()">आगे बढ़ें</button>
                    <button class="back-to-social" onclick="resetAuthView()">← पीछे जाएं</button>
                </div>
            </div>
        </div>

        <!-- हेडर -->
        <div class="header">
            <h1>Desi Reels</h1>
            <div id="userProfileDisplay" class="user-info" onclick="logoutUser()" title="लॉग आउट">प्रोफाइल</div>
        </div>

        <!-- रील्स फीड -->
        <div class="reels-container" id="reelsContainer"></div>

        <!-- बॉटम नेविगेशन -->
        <div class="navbar">
            <button class="nav-item">🏠 होम</button>
            <button class="upload-tab-btn" onclick="openUploadModal()">＋</button>
            <button class="nav-item" onclick="logoutUser()">🚪 लॉग आउट</button>
        </div>

        <!-- अपलोड मॉडल -->
        <div class="upload-modal" id="uploadModal">
            <div class="upload-header">
                <h3>नया रील अपलोड करें</h3>
                <button class="close-modal" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="upload-form">
                <input type="file" id="videoFile" accept="video/*">
                <textarea id="videoCaption" placeholder="इस रील के बारे में कुछ लिखें..."></textarea>
                <button class="submit-btn" onclick="uploadReel()">अपलोड करें</button>
            </div>
        </div>

    </div>

    <script>
        // आपके असली Firebase की कॉन्फिगरेशन
        const firebaseConfig = {
            apiKey: "AIzaSyAb7NVBfgm-E9CK6vnX2du0p2JyIzpAYmE",
            authDomain: "desi-reels-be2fc.firebaseapp.com",
            projectId: "desi-reels-be2fc",
            storageBucket: "desi-reels-be2fc.firebasestorage.app",
            messagingSenderId: "286897054744",
            appId: "1:286897054744:web:7de881bc6a6155eb074f6d",
            measurementId: "G-KCYW6JTXPG"
        };

        // Firebase इनिशियलाइज करना
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = localStorage.getItem('desiReels_currentUser');
        let selectedMethod = '';

        let defaultReels = [
            {
                username: "Desi Creator",
                caption: "इश्क़ की वादी - खूबसूरत मौसम और संगीत! 🎶",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                likes: 124
            }
        ];

        let reelsData = [];

        window.onload = async function() {
            if (currentUser) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('userProfileDisplay').innerText = currentUser;
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
            }
            await loadReelsFromCloud();
        };

        // क्लाउड (Firebase Firestore) से रील्स लोड करना
        async function loadReelsFromCloud() {
            try {
                const snapshot = await db.collection('reels').orderBy('timestamp', 'desc').get();
                if (!snapshot.empty) {
                    reelsData = [];
                    snapshot.forEach(doc => {
                        reelsData.push(doc.data());
                    });
                } else {
                    reelsData = defaultReels;
                }
                renderReels();
            } catch (error) {
                console.error("Error loading reels: ", error);
                reelsData = defaultReels;
                renderReels();
            }
        }

        function promptLogin(method) {
            selectedMethod = method;
            document.getElementById('socialButtonsContainer').style.display = 'none';
            document.getElementById('inputGroup').classList.add('active');

            const inputField = document.getElementById('userInputField');
            const heading = document.getElementById('authHeading');

            if (method === 'Google') {
                heading.innerText = "Google लॉगिन";
                inputField.placeholder = "अपनी Gmail आईडी दर्ज करें";
                inputField.type = "email";
            } else if (method === 'Facebook') {
                heading.innerText = "Facebook लॉगिन";
                inputField.placeholder = "अपना Facebook नाम दर्ज करें";
                inputField.type = "text";
            } else if (method === 'Phone') {
                heading.innerText = "मोबाइल लॉगिन";
                inputField.placeholder = "10 अंकों का मोबाइल नंबर दर्ज करें";
                inputField.type = "tel";
                inputField.maxLength = 10;
            }
        }

        function resetAuthView() {
            document.getElementById('socialButtonsContainer').style.display = 'block';
            document.getElementById('inputGroup').classList.remove('active');
            document.getElementById('authHeading').innerText = "Desi Reels";
            document.getElementById('userInputField').value = '';
        }

        function completeLogin() {
            const val = document.getElementById('userInputField').value.trim();
            if (!val) {
                alert("कृपया जानकारी दर्ज करें!");
                return;
            }

            if (selectedMethod === 'Phone' && val.length < 10) {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!");
                return;
            }

            currentUser = val;
            localStorage.setItem('desiReels_currentUser', currentUser);
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('userProfileDisplay').innerText = currentUser;
            loadReelsFromCloud();
        }

        function logoutUser() {
            localStorage.removeItem('desiReels_currentUser');
            location.reload();
        }

        function renderReels() {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = "";

            reelsData.forEach((reel, index) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.innerHTML = `
                    <video src="${reel.videoUrl}" loop autoplay muted playsinline></video>
                    <div class="reel-actions">
                        <button class="action-btn" onclick="likeReel(${index})">❤️</button>
                        <span class="action-text">${reel.likes || 0}</span>
                    </div>
                    <div class="reel-details">
                        <div class="reel-username">@${reel.username}</div>
                        <div class="reel-caption">${reel.caption}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function likeReel(index) {
            reelsData[index].likes = (reelsData[index].likes || 0) + 1;
            renderReels();
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        // क्लाउड डेटाबेस पर नई रील सेव करना
        async function uploadReel() {
            const fileInput = document.getElementById('videoFile');
            const captionInput = document.getElementById('videoCaption');

            if (fileInput.files.length === 0) {
                alert("कृपया कोई वीडियो चुनें!");
                return;
            }

            const file = fileInput.files[0];
            const videoUrl = URL.createObjectURL(file); // लोकल फाइल प्रिव्यू URL
            const caption = captionInput.value || "मेरी नई रील";

            const newReel = {
                username: currentUser,
                caption: caption,
                videoUrl: videoUrl,
                likes: 0,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                // Firestore डेटाबेस में सेव करें
                await db.collection('reels').add(newReel);
                alert("रील सफलतापूर्वक क्लाउड पर अपलोड हो गई!");
                await loadReelsFromCloud();
                closeUploadModal();
                fileInput.value = "";
                captionInput.value = "";
            } catch (error) {
                console.error("Error uploading: ", error);
                alert("अपलोड करने में कुछ त्रुटि हुई!");
            }
        }
   /* दाईं ओर तैरने वाले एक्शन बटन (लाइक, कमेंट, शेयर) */
.action-buttons {
    position: absolute;
    right: 15px;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    z-index: 40;
}

.action-btn {
    background: rgba(0, 0, 0, 0.5);
    border: none;
    color: white;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    cursor: pointer;
}

.action-btn span {
    font-size: 12px;
    margin-top: 2px;
}
 </script>
</body>
</html>
