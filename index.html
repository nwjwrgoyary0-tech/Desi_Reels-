<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Reels - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #121212;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        @media(min-width: 481px) {
            #app-container {
                height: 90vh;
                border-radius: 20px;
                box-shadow: 0 10px 30px rgba(255,255,255,0.1);
            }
        }

        /* ऑथेंटिकेशन / लॉगिन स्क्रीन */
        .auth-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-screen.hidden {
            display: none;
        }

        .auth-box {
            background: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        .auth-box h2 {
            margin-bottom: 8px;
            color: #ff3b5c;
            font-size: 24px;
        }

        .auth-box p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }

        /* सोशल और मोबाइल लॉगिन बटन */
        .social-btn {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: opacity 0.2s;
        }

        .social-btn:active {
            opacity: 0.8;
        }

        .google-btn {
            background: #fff;
            color: #333;
        }

        .facebook-btn {
            background: #1877f2;
            color: #fff;
        }

        .phone-btn {
            background: #25d366;
            color: #fff;
        }

        .divider {
            margin: 15px 0;
            font-size: 13px;
            color: #666;
            position: relative;
        }

        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #444;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        /* मोबाइल इनपुट फॉर्म */
        .phone-input-group {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .phone-input-group.active {
            display: flex;
        }

        .auth-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #222;
            color: #fff;
            font-size: 15px;
        }

        .auth-box button.submit-phone {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #ff3b5c;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .back-to-social {
            margin-top: 10px;
            font-size: 13px;
            color: #ff3b5c;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* टॉप हेडर */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }

        .header h1 {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #ff3b5c;
        }

        .user-info {
            font-size: 13px;
            color: #ddd;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        /* रील्स फीड */
        .reels-container {
            flex: 1;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* रील्स एक्शन बटन */
        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 5;
        }

        .action-btn {
            background: rgba(0,0,0,0.5);
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .action-text {
            font-size: 12px;
            margin-top: 2px;
            text-align: center;
        }

        .reel-details {
            position: absolute;
            left: 15px;
            bottom: 20px;
            right: 80px;
            z-index: 5;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        .reel-username {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .reel-caption {
            font-size: 14px;
            color: #eee;
        }

        /* बॉटम नेविगेशन */
        .navbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
        }

        .upload-tab-btn {
            background: #ff3b5c;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* अपलोड मॉडल */
        .upload-modal {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80%;
            background: #1e1e1e;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 20;
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease-in-out;
            transform: translateY(100%);
        }

        .upload-modal.active {
            transform: translateY(0);
        }

        .upload-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-modal {
            background: none;
            border: none;
            color: #aaa;
            font-size: 22px;
            cursor: pointer;
        }

        .upload-form input[type="file"],
        .upload-form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .upload-form textarea {
            resize: none;
            height: 100px;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ff3b5c;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="app-container">
        
        <!-- लॉगिन स्क्रीन (Google, Facebook, Mobile) -->
        <div id="authScreen" class="auth-screen">
            <div class="auth-box">
                <h2>Desi Reels</h2>
                <p>लॉगिन करके अपनी रील्स शेयर करें</p>

                <!-- सोशल लॉगिन बटन्स -->
                <div id="socialButtonsContainer">
                    <button class="social-btn google-btn" onclick="loginWithSocial('Google User')">
                        🌐 Google से लॉगिन करें
                    </button>
                    <button class="social-btn facebook-btn" onclick="loginWithSocial('Facebook User')">
                        📘 Facebook से लॉगिन करें
                    </button>
                    <div class="divider">या</div>
                    <button class="social-btn phone-btn" onclick="showPhoneInput()">
                        📱 मोबाइल नंबर से लॉगिन करें
                    </button>
                </div>

                <!-- मोबाइल नंबर इनपुट सेक्शन -->
                <div id="phoneInputGroup" class="phone-input-group">
                    <input type="tel" id="mobileInput" placeholder="अपना मोबाइल नंबर दर्ज करें" maxlength="10">
                    <button class="submit-phone" onclick="loginWithPhone()">जारी रखें</button>
                    <button class="back-to-social" onclick="hidePhoneInput()">← वापस जाएं</button>
                </div>
            </div>
        </div>

        <!-- टॉप हेडर -->
        <div class="header">
            <h1>Desi Reels</h1>
            <div id="userProfileDisplay" class="user-info" onclick="logoutUser()" title="लॉग आउट">प्रोफाइल</div>
        </div>

        <!-- रील्स फीड एरिया -->
        <div class="reels-container" id="reelsContainer"></div>

        <!-- बॉटम नेविगेशन -->
        <div class="navbar">
            <button class="nav-item">🏠 होम</button>
            <button class="upload-tab-btn" onclick="openUploadModal()">+</button>
            <button class="nav-item" onclick="logoutUser()">🚪 लॉग आउट</button>
        </div>

        <!-- वीडियो अपलोड मॉडल -->
        <div class="upload-modal" id="uploadModal">
            <div class="upload-header">
                <h3>नया रील अपलोड करें</h3>
                <button class="close-modal" onclick="closeUploadModal()">&times;</button>
            </div>
            <div class="upload-form">
                <input type="file" id="videoFile" accept="video/*">
                <textarea id="videoCaption" placeholder="इस रील के बारे में कुछ लिखें..."></textarea>
                <button class="submit-btn" onclick="uploadReel()">अपलोड करें</button>
            </div>
        </div>

    </div>

    <script>
        let currentUser = localStorage.getItem('desiReels_currentUser');

        let reelsData = JSON.parse(localStorage.getItem('desiReels_videos')) || [
            {
                username: "Desi Creator",
                caption: "इश्क़ की वादी - खूबसूरत मौसम और संगीत! 🎶",
                videoUrl: "https://www.w3schools.com/html/mov_bbb.mp4",
                likes: 124
            }
        ];

        window.onload = function() {
            if (currentUser) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('userProfileDisplay').innerText = currentUser;
                renderReels();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
            }
        };

        // Google या Facebook से डायरेक्ट लॉगिन
        function loginWithSocial(providerName) {
            currentUser = providerName;
            localStorage.setItem('desiReels_currentUser', currentUser);
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('userProfileDisplay').innerText = currentUser;
            renderReels();
        }

        // मोबाइल नंबर इनपुट दिखाना
        function showPhoneInput() {
            document.getElementById('socialButtonsContainer').style.display = 'none';
            document.getElementById('phoneInputGroup').classList.add('active');
        }

        // वापस सोशल बटन पर जाना
        function hidePhoneInput() {
            document.getElementById('socialButtonsContainer').style.display = 'block';
            document.getElementById('phoneInputGroup').classList.remove('active');
        }

        // मोबाइल नंबर से लॉगिन
        function loginWithPhone() {
            const phone = document.getElementById('mobileInput').value.trim();
            if (phone.length < 10) {
                alert("कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें!");
                return;
            }
            currentUser = "User_" + phone.slice(-4); // मोबाइल के आखिरी 4 अंक यूजरनेम के रूप में
            localStorage.setItem('desiReels_currentUser', currentUser);
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('userProfileDisplay').innerText = currentUser;
            renderReels();
        }

        // लॉग आउट
        function logoutUser() {
            localStorage.removeItem('desiReels_currentUser');
            location.reload();
        }

        // रील्स रेंडर करना
        function renderReels() {
            const container = document.getElementById('reelsContainer');
            container.innerHTML = "";

            reelsData.forEach((reel, index) => {
                const card = document.createElement('div');
                card.className = 'reel-card';
                card.innerHTML = `
                    <video src="${reel.videoUrl}" loop autoplay muted playsinline></video>
                    <div class="reel-actions">
                        <button class="action-btn" onclick="likeReel(${index})">❤️</button>
                        <span class="action-text">${reel.likes}</span>
                    </div>
                    <div class="reel-details">
                        <div class="reel-username">@${reel.username}</div>
                        <div class="reel-caption">${reel.caption}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function likeReel(index) {
            reelsData[index].likes += 1;
            renderReels();
        }

        function openUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
        }

        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
        }

        function uploadReel() {
            const fileInput = document.getElementById('videoFile');
            const captionInput = document.getElementById('videoCaption');

            if (fileInput.files.length === 0) {
                alert("कृपया कोई वीडियो चुनें!");
                return;
            }

            const file = fileInput.files[0];
            const videoUrl = URL.createObjectURL(file);
            const caption = captionInput.value || "मेरी नई रील";

            const newReel = {
                username: currentUser,
                caption: caption,
                videoUrl: videoUrl,
                likes: 0
            };

            reelsData.unshift(newReel);
            localStorage.setItem('desiReels_videos', JSON.stringify(reelsData));
            
            renderReels();
            closeUploadModal();
            fileInput.value = "";
            captionInput.value = "";
            alert("रील सफलतापूर्वक अपलोड हो गई!");
        }
    </script>
</body>
</html>
