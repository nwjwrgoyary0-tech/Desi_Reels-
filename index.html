<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desi Reels</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* रील्स फीड कंटेनर */
        .reels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100vh - 65px);
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .reels-container::-webkit-scrollbar {
            display: none;
        }

        .reel-card {
            position: relative;
            width: 100%;
            height: 100%;
            scroll-snap-align: start;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
        }

        .reel-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ऊपर हेडर */
        .header {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            pointer-events: none;
        }

        .header h1 {
            font-size: 18px;
            color: #ff3b5c;
        }

        .user-phone-badge {
            background: rgba(0, 0, 0, 0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #fff;
            pointer-events: auto;
        }

        /* दाईं ओर तैरने वाले एक्शन बटन (लाइक, कमेंट, शेयर) */
        .action-buttons {
            position: absolute;
            right: 15px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 40;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }

        .action-btn span {
            font-size: 12px;
            margin-top: 2px;
        }

        /* नीचे फिक्स बॉटम नेविगेशन बार (+ बटन के साथ) */
        .navbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 65px;
            background: #121212;
            border-top: 1px solid #222;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 50;
        }

        .nav-item {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            color: #fff;
            font-weight: bold;
        }

        .upload-btn {
            background: #ff3b5c;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ऐप का हेडर -->
    <div class="header">
        <h1>Desi Reels</h1>
        <div class="user-phone-badge" id="userBadge">Loding...</div>
    </div>

    <!-- रील्स फीड एरिया -->
    <div class="reels-container" id="reelsContainer">
        <!-- उदाहरण के लिए एक सैंपल रील -->
        <div class="reel-card">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" autoplay loop muted playsinline></video>
            
            <!-- दाईं तरफ के एक्शन बटन -->
            <div class="action-buttons">
                <button class="action-btn">❤️<span>124</span></button>
                <button class="action-btn">💬<span>12</span></button>
                <button class="action-btn">↗️<span>शेयर</span></button>
            </div>
        </div>
    </div>

    <!-- नीचे का नेविगेशन बार और अपलोड बटन -->
    <nav class="navbar">
        <button class="nav-item active">होम</button>
        <button class="upload-btn">+</button>
        <button class="nav-item">प्रोफाइल</button>
    </nav>

    <script>
        // यहाँ यूजर का लॉगिन स्टेटस या मोबाइल नंबर दिखाने के लिए बेसिक स्क्रिप्ट
        window.addEventListener('DOMContentLoaded', () => {
            const badge = document.getElementById('userBadge');
            // लोकल स्टोरेज या ऑथेंटिकेशन से यूजर का नंबर सेट करना
            badge.innerText = "9678829900"; 
        });
    </script>
</body>
</html>
