<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Desi Reels App</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; background: #000; font-family: sans-serif; overflow: hidden; }
        
        .reels-container {
            width: 100%;
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }
        .reels-container::-webkit-scrollbar { display: none; }

        .reel {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .reel video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reel-info {
            position: absolute;
            bottom: 35px;
            left: 15px;
            right: 75px;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0,0,0,0.9);
        }
        .username { font-weight: bold; font-size: 16px; margin-bottom: 6px; color: #f1f1f1; }
        .caption { font-size: 14px; opacity: 0.95; line-height: 1.4; }

        .reel-actions {
            position: absolute;
            right: 15px;
            bottom: 45px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .action-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .action-btn:active { transform: scale(0.85); }

        .upload-top-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: #ff2d55;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255,45,85,0.4);
        }

        #uploadModal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }
        .modal-box {
            background: #1c1c1e;
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
            color: white;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-box h3 { margin-bottom: 15px; font-size: 18px; }
        .modal-box input[type="file"] { margin: 15px 0; color: #ccc; width: 100%; font-size: 14px; }
        .modal-box input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #3a3a3c; background: #2c2c2e; color: white; font-size: 14px; outline: none; }
        .btn-group { display: flex; gap: 12px; justify-content: center; }
        .modal-btn { padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; font-size: 14px; flex: 1; }
    </style>
</head>
<body>

    <button class="upload-top-btn" onclick="openModal()">+ Upload</button>

    <div id="uploadModal">
        <div class="modal-box">
            <h3>Upload New Reel</h3>
            <input type="file" id="videoFile" accept="video/*"><br>
            <input type="text" id="captionText" placeholder="Write a caption..."><br>
            <div class="btn-group">
                <button class="modal-btn" style="background: #34c759;" onclick="uploadVideo()">Post</button>
                <button class="modal-btn" style="background: #ff3b30;" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <div class="reels-container" id="reelsContainer">
        <div class="reel">
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" loop playsinline autoplay muted onclick="togglePlay(this)"></video>
            <div class="reel-info">
                <div class="username">@creator_hd</div>
                <div class="caption">Enjoying high quality crystal clear video! 🎬🔥</div>
            </div>
            <div class="reel-actions">
                <button class="action-btn" onclick="likeVideo(this)">❤️</button>
                <button class="action-btn" onclick="shareVideo()">↗️</button>
            </div>
        </div>

        <div class="reel">
            <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" loop playsinline muted onclick="togglePlay(this)"></video>
            <div class="reel-info">
                <div class="username">@trending_shorts</div>
                <div class="caption">Smooth vertical scrolling experience 🚀</div>
            </div>
            <div class="reel-actions">
                <button class="action-btn" onclick="likeVideo(this)">❤️</button>
                <button class="action-btn" onclick="shareVideo()">↗️</button>
            </div>
        </div>
    </div>

    <script>
        function togglePlay(video) {
            video.muted = false;
            if (video.paused) { video.play(); } else { video.pause(); }
        }

        function likeVideo(btn) {
            if (btn.style.color === "red") {
                btn.style.color = "white";
                btn.innerHTML = "❤️";
            } else {
                btn.style.color = "red";
                btn.innerHTML = "💖";
            }
        }

        function shareVideo() {
            if (navigator.share) {
                navigator.share({ title: 'Desi Reels', text: 'Check out this amazing reel!', url: window.location.href }).catch(console.error);
            } else {
                alert("Link copied to clipboard!");
            }
        }

        function openModal() { document.getElementById('uploadModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('uploadModal').style.display = 'none'; }

        function uploadVideo() {
            const fileInput = document.getElementById('videoFile');
            const caption = document.getElementById('captionText').value || "My New Reel 🎥";

            if (fileInput.files.length === 0) {
                alert("Please select a video file first!");
                return;
            }

            const videoUrl = URL.createObjectURL(fileInput.files[0]);
            const container = document.getElementById('reelsContainer');

            const newReel = document.createElement('div');
            newReel.className = 'reel';
            newReel.innerHTML = `
                <video src="${videoUrl}" loop playsinline autoplay onclick="togglePlay(this)"></video>
                <div class="reel-info">
                    <div class="username">@my_profile</div>
                    <div class="caption">${caption}</div>
                </div>
                <div class="reel-actions">
                    <button class="action-btn" onclick="likeVideo(this)">❤️</button>
                    <button class="action-btn" onclick="shareVideo()">↗️</button>
                </div>
            `;

            container.prepend(newReel);
            closeModal();
            alert("Reel uploaded successfully!");
            
            fileInput.value = '';
            document.getElementById('captionText').value = '';
        }

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const video = entry.target.querySelector('video');
                if (entry.isIntersecting) {
                    video.play().catch(e => console.log("Autoplay blocked"));
                } else {
                    video.pause();
                    video.currentTime = 0;
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.reel').forEach(reel => { observer.observe(reel); });
    </script>
</body><!-- Upload Modal / Form -->
<div id="uploadModal" style="display:none; background: #ffffff; padding: 20px; border-radius: 12px; position: fixed; top: 25%; left: 10%; right: 10%; z-index: 1000; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <h3 style="margin-top: 0; color: #333;">Upload New Reel</h3>
    
    <!-- Video Select Karne Ka Button -->
    <input type="file" id="videoFile" accept="video/*" style="margin: 10px 0; width: 100%;"><br>
    
    <!-- Caption Likhne Ka Box -->
    <input type="text" id="videoCaption" placeholder="Write a caption..." style="width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;"><br>
    
    <!-- Post Aur Cancel Buttons -->
    <button onclick="uploadVideo()" style="background: #ff2442; color: white; padding: 10px 20px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Post Reel</button>
    <button onclick="document.getElementById('uploadModal').style.display='none'" style="background: #ccc; color: #333; padding: 10px 20px; border: none; border-radius: 6px; margin-left: 10px; cursor: pointer;">Cancel</button>
</div>

</html>
